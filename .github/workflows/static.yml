name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site

          # Task 1 becomes the homepage
          cp -R WebDev-L1-LandingPage/. _site/

          # Task 2
          mkdir -p _site/WebDev-L1-PersonalPortfolio
          cp -R WebDev-L1-PersonalPortfolio/. _site/WebDev-L1-PersonalPortfolio/

          # Task 3 (will be included when the folder exists)
          if [ -d "WebDev-L1-TemperatureConverter" ]; then
            mkdir -p _site/WebDev-L1-TemperatureConverter
            cp -R WebDev-L1-TemperatureConverter/. _site/WebDev-L1-TemperatureConverter/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
